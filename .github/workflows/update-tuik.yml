# Writes TÜİK's inflation into params.json from TCMB's EVDS service.
#
# Dormant: EVDS answered every request from GitHub's runners with its own web
# page rather than data, whether the key travelled in the header or in the
# query, so the figures are written by hand instead (see README). The monthly
# schedule is deliberately removed — a job that fails every month teaches
# everyone to ignore it. Run it from the Actions tab if EVDS ever cooperates.
name: Update TÜİK inflation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read EVDS and update params.json
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python3 update_tuik.py params.json

      - name: Commit if anything changed
        run: |
          if git diff --quiet params.json; then
            echo "No change."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -am "TÜİK inflation update"
          git push
